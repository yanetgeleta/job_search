[project]
name = "job-scraper"
version = "0.1.0"
description = "Local web UI for python-jobspy"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "jinja2==3.1.6",
    "pandas==3.1.0",
    "python-jobspy==1.4.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
